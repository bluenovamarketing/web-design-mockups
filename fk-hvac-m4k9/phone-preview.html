<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Frost &amp; Kretsch Homepage — Phone Preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      padding: 16px 12px 24px;
      color: #132b47;
      background: linear-gradient(145deg, #eef2f5, #d9e0e6);
      font-family: Arial, Helvetica, sans-serif;
    }
    .preview-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(390px, calc(100vw - 24px));
      margin: 0 auto 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .preview-heading span { color: #647386; font-size: 10px; }
    .phone {
      position: relative;
      width: min(390px, calc(100vw - 24px));
      height: min(844px, calc(100vh - 76px));
      min-height: 620px;
      margin: 0 auto;
      padding: 12px;
      overflow: hidden;
      border: 1px solid #293746;
      border-radius: 34px;
      background: #0a1118;
      box-shadow: 0 28px 70px rgba(16, 34, 53, .28);
    }
    .phone::before {
      content: "";
      position: absolute;
      z-index: 2;
      top: 5px;
      left: 50%;
      width: 92px;
      height: 17px;
      border-radius: 0 0 12px 12px;
      background: #0a1118;
      transform: translateX(-50%);
      pointer-events: none;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 24px;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="preview-heading">
    <strong>Frost &amp; Kretsch Homepage</strong>
    <span>Phone preview · 390px</span>
  </div>
  <div class="phone">
    <iframe src="./?phone-preview=1" title="Frost and Kretsch Heating and Cooling mobile homepage preview"></iframe>
  </div>
</body>
</html>
